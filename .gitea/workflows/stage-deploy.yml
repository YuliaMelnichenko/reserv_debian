name: Deploy test stand

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy selected revision to stage
    runs-on: tori-stage-deploy
    timeout-minutes: 20
    env:
      TORI_STAGE_RELEASES_DIR: /var/www/tori-stage-releases
      TORI_STAGE_CURRENT_LINK: /var/www/tori-stage-releases/current
      TORI_STAGE_SHARED_ENV: /var/www/tori-stage/.env
      TORI_STAGE_HEALTH_URL: http://192.168.100.216:8080/health.php
      TORI_STAGE_HEALTH_TOKEN: ${{ secrets.TORI_STAGE_HEALTH_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate source before deployment
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN=php8.4 bash scripts/ci/php-lint.sh
          php8.4 tests/run.php
      - name: Deploy checked revision
        shell: bash
        run: bash scripts/deploy-stage-release.sh "${{ gitea.workspace }}"
