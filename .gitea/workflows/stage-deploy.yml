name: Stage deployment (not enabled)

on:
  workflow_dispatch:

jobs:
  deployment-not-enabled:
    runs-on: tori-stage-deploy
    timeout-minutes: 1
    steps:
      - name: Explain deployment setup status
        shell: bash
        run: |
          echo 'Deployment is not enabled. No files or database records were changed.'
          echo 'Run Check stage deployment runner (stage-runner-check.yml) first.'

